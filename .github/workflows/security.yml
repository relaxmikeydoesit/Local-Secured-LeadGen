name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly, catches newly published advisories

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose

  sast:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static analysis
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
            semgrep scan --config p/javascript --config p/typescript --config p/owasp-top-ten \
            --error --metrics=off /src

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: OSV-Scanner
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest \
            scan --lockfile=/src/package-lock.json

  build:
    name: build + header checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (contact function, CSP guard, image sanitizer)
        run: npm test
      - name: Build (also strips-checks images and verifies no inline code)
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  zap:
    name: ZAP baseline (own preview only)
    runs-on: ubuntu-latest
    needs: build
    # Only run active/passive scans against the preview of THIS repo, never third-party sites.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Serve dist with the same headers as production
        run: |
          node scripts/serve-dist.mjs dist 8080 &
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/ >/dev/null && break || sleep 1; done
      - name: ZAP baseline scan
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -I -r zap-report.html -J zap-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-out
          retention-days: 14
